[project]
name = "humanizer"
version = "0.1.0"
description = "Local AI-writing detector and humanizer"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",  # required by FastAPI for file uploads
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-docx>=1.1",
    "pypdf>=5.1",
    "spacy>=3.8",
    "numpy>=1.26",
    "typer>=0.15",
    "rich>=13.9",
]

[project.optional-dependencies]
# Phase 2 — local statistical detectors (large download)
models = [
    "torch>=2.5",
    "transformers>=4.46",
    "sentence-transformers>=3.3",
]
# Phase 3 — calibration.
# Uses sklearn's HistGradientBoostingClassifier rather than LightGBM: same
# algorithm family, but LightGBM's macOS wheels need a system libomp install
# and we do not want a dev dependency reaching outside the venv.
calibrate = [
    "scikit-learn>=1.5",
]
# Phase 5 — Claude rewrite engine (opt-in)
llm = [
    "anthropic>=0.40",
]
# Phase 6 — export
export = [
    "reportlab>=4.2",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
humanizer = "humanizer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["humanizer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 fires on every Typer command: `typer.Option(...)` in a default is the
# framework's required idiom, not a mutable-default bug.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
